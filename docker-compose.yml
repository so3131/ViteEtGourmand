# définit les services et les conteneurs à lancer
services:
  # définit le service pour l'application
  app:
    # définit le contexte de construction et le Dockerfile utilisé pour construire l'image du conteneur
    build:
      context: .
      dockerfile: Dockerfile
    # définit les ports exposés pour le conteneur de l'application
    ports:
      - "8080:80"
    # définit les volumes où les fichiers locaux sont montés dans le conteneur, pour le développement en temps réel
    # (+ crée un volume vendor vide pour éviter de monter le dossier vendor du projet local dans le conteneur)
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    # définit les variables d'environnement de l'application (base de données, MongoDB, mails, API de routage)
    environment:
      APP_ENV: docker
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_PORT: 3306
      MONGODB_URI: ${MONGODB_URI}
      BREVO_API_KEY: ${BREVO_API_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
    # définit les dépendances du service (ordre de démarrage)
    depends_on:
      - db
  # définit le service pour la base de données
  db:
    # définit l'image utilisée pour le conteneur de la base de données
    image: mariadb:10.6
    # définit les variables d'environnement pour configurer la base de données
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    # définit les ports exposés pour le conteneur de la base de données
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # importe automatiquement le schéma puis les données au premier démarrage
      - ./app/Database/Schema_VG.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./app/Database/fixture_VG.sql:/docker-entrypoint-initdb.d/02-fixture.sql

volumes:
  db_data: